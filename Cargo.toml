[package]
name = "pr-review"
version = "0.1.3"
edition = "2024"
authors = ["Ualter Otoni <ualter.junior@gmail.com>"]
description = "AI-powered CLI tool for reviewing pull requests from CodeCommit, Bitbucket, and other platforms."
license = "Apache-2.0"
readme = "README.md"
keywords = ["cli", "pull-request", "code-review", "ai", "github-copilot"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/ualter/pr-review"
homepage = "https://github.com/ualter/pr-review"
default-run = "pr-review"

[features]
default = ["copilot-sdk"]
copilot-sdk = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
dialoguer = "0.12.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"
termimad = "0.34.1"
github-copilot-sdk = "0.1.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
ctrlc = "3.4.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
